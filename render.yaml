services:
  - type: web
    name: urna-eleitoral
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: URNA_SENHA
        value: "123456"
      - key: URNA_DADOS_DIR
        value: "/app/data"
